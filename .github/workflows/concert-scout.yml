name: Concert Scout

on:
  schedule:
    # Runs every Monday at 13:00 UTC (8:00 AM CDT / 7:00 AM CST).
    - cron: "0 13 * * 1"
  workflow_dispatch:
    inputs:
      run_husband:
        description: "Also run the separate Metalcore profile"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: concert-scout-state
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Search and send alerts
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python concert_scout.py
      - name: Search husband profile
        if: ${{ github.event_name == 'schedule' || inputs.run_husband }}
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: >-
          python concert_scout.py
          --config profiles/husband.json
          --state data/seen_events_husband.json
          --recipient-env ALERT_EMAIL_TO
      - name: Commit updated event state
        run: |
          if git diff --quiet -- data/; then
            echo "State unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore: update concert scout state [skip ci]"
          git pull --rebase
          git push
